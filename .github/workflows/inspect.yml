name: Inspect Minecraft 26.3 rendering API

on:
  push:
    paths:
      - '.github/workflows/inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect Minecraft and Fabric rendering signatures
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, urllib.request, zipfile, xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          out = pathlib.Path("inspection")
          out.mkdir(exist_ok=True)

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "VisionBrowser-26.3-API-Inspector"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read()

          manifest = json.loads(get("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"))
          matches = [v for v in manifest["versions"] if v["id"] == "26.3"]
          if not matches or matches[0]["type"] != "release":
              raise SystemExit("Minecraft Java 26.3 release not found in Mojang manifest")
          version = json.loads(get(matches[0]["url"]))
          client = version["downloads"]["client"]
          jar = pathlib.Path("minecraft-26.3-client.jar")
          jar.write_bytes(get(client["url"]))
          digest = hashlib.sha1(jar.read_bytes()).hexdigest()
          if digest != client["sha1"]:
              raise SystemExit("Minecraft client SHA-1 verification failed")

          wanted = [
              "net.minecraft.client.renderer.SubmitNodeCollector",
              "net.minecraft.client.renderer.OrderedSubmitNodeCollector",
              "net.minecraft.client.renderer.SubmitNodeStorage",
              "net.minecraft.client.gui.GuiGraphicsExtractor",
              "net.minecraft.client.gui.screens.Screen",
              "net.minecraft.client.renderer.GameRenderer",
              "net.minecraft.client.renderer.LevelRenderer",
              "com.mojang.blaze3d.systems.RenderSystem",
              "com.mojang.blaze3d.vertex.PoseStack",
          ]
          report = ["# Minecraft Java 26.3 API inspection", "", "Static signatures only. This does not prove runtime behavior.", "",
                    "Minecraft client SHA-1: " + digest, ""]
          for cls in wanted:
              p = subprocess.run(["javap", "-public", "-classpath", str(jar), cls], capture_output=True, text=True)
              report += ["## " + cls, "```java", p.stdout or p.stderr, "```", ""]

          metadata = ET.fromstring(get("https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml"))
          versions = sorted({e.text for e in metadata.iter("version") if e.text and e.text.endswith("+26.3")})
          if not versions:
              raise SystemExit("No Fabric API artifact for Minecraft 26.3 found")
          api_version = versions[-1]
          api_url = f"https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/{api_version}/fabric-api-{api_version}.jar"
          api_jar = pathlib.Path("fabric-api.jar")
          api_jar.write_bytes(get(api_url))
          report += ["## Fabric API artifact", "", "Version: " + api_version, "URL: " + api_url, ""]
          with zipfile.ZipFile(api_jar) as archive:
              nested = []
              for name in archive.namelist():
                  if name.startswith("META-INF/jars/") and name.endswith(".jar"):
                      target = pathlib.Path("fabric-nested") / pathlib.Path(name).name
                      target.parent.mkdir(exist_ok=True)
                      target.write_bytes(archive.read(name))
                      nested.append(target)
              classes = set()
              for nested_jar in nested:
                  with zipfile.ZipFile(nested_jar) as z:
                      classes.update(n[:-6].replace("/", ".") for n in z.namelist()
                                     if n.endswith(".class") and "/rendering/" in n)
              report += ["## Fabric rendering API classes", "```text", *sorted(classes), "```"]
              cp = ":".join(str(p) for p in nested)
              for cls in sorted(classes):
                  p = subprocess.run(["javap", "-public", "-classpath", cp, cls], capture_output=True, text=True)
                  if p.returncode == 0:
                      report += ["### " + cls, "```java", p.stdout, "```"]
          pathlib.Path(out / "SEND_THIS_TO_CLAUDE.md").write_text("\n".join(report))
          print("Inspection report generated:", (out / "SEND_THIS_TO_CLAUDE.md").stat().st_size, "bytes")
          PY
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: SEND-THIS-TO-CLAUDE
          path: inspection/SEND_THIS_TO_CLAUDE.md
          if-no-files-found: error
